name: Watch IndieCRM Connect 1.2.2 rollout
run-name: Chrome review watch · ${{ github.event_name }} · ${{ github.run_id }}
on:
  schedule:
    # Every 15 minutes at 08, 23, 38 and 53 UTC.
    - cron: "8/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: indiecrm-chrome-review-watch
  cancel-in-progress: false
jobs:
  check-review:
    if: github.repository == 'danielsinewe/indiecrm-extension-rollout' && github.ref == 'refs/heads/main' && vars.CHROME_WEBSTORE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Queue the isolated keyless publisher
        run: |
          gh workflow run store.yml --repo danielsinewe/indiecrm-extension-rollout --ref main \
            -f command=publish -f release_tag=chrome-extension-v1.2.2 \
            -f "request_id=review-watch-$GITHUB_RUN_ID"
          echo 'Queued the pinned 1.2.2 release; preserve the 1.2.1 review and publish each approved release.' >> "$GITHUB_STEP_SUMMARY"
