name: Automatic 15-minute IndieCRM 1.3.14 rollout
run-name: Chrome review clock · ${{ inputs.clock_id }} · ${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      clock_id:
        description: Exact commissioned release clock generation
        type: string
        required: true
permissions:
  contents: read
  actions: write
concurrency:
  group: indiecrm-chrome-review-watch
  cancel-in-progress: false
jobs:
  check-review:
    if: github.repository == 'danielsinewe/indiecrm-extension-rollout' && github.ref == 'refs/heads/main' && vars.CHROME_WEBSTORE_PUBLISH_ENABLED == 'true' && inputs.clock_id != '' && inputs.clock_id == vars.CHROME_REVIEW_CLOCK_ID
    environment: chrome-review-delay
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_ENABLED: ${{ vars.CHROME_WEBSTORE_PUBLISH_ENABLED }}
      REVIEW_CLOCK_ID: ${{ inputs.clock_id }}
      EXPECTED_CLOCK_ID: ${{ vars.CHROME_REVIEW_CLOCK_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Queue the isolated publisher and next delayed check
        run: node src/review-clock.mjs
