name: Automatic 15-minute IndieCRM 1.3.21 rollout
run-name: Chrome review clock · ${{ inputs.clock_id }} · ${{ github.run_id }}
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      clock_id:
        description: Exact commissioned release clock generation
        type: string
        required: true
      recovery_only:
        description: Run the scheduled recovery path without creating another clock
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
jobs:
  check-review:
    concurrency:
      group: indiecrm-chrome-review-watch
      cancel-in-progress: false
    if: github.event_name != 'schedule' && !inputs.recovery_only && github.repository == 'danielsinewe/indiecrm-extension-rollout' && github.ref == 'refs/heads/main' && vars.CHROME_WEBSTORE_PUBLISH_ENABLED == 'true' && inputs.clock_id != '' && inputs.clock_id == vars.CHROME_REVIEW_CLOCK_ID
    environment: chrome-review-delay
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_ENABLED: ${{ vars.CHROME_WEBSTORE_PUBLISH_ENABLED }}
      REVIEW_CLOCK_ID: ${{ inputs.clock_id }}
      EXPECTED_CLOCK_ID: ${{ vars.CHROME_REVIEW_CLOCK_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Queue the isolated publisher and next delayed check
        run: node src/review-clock.mjs

  recover-stalled-clock:
    if: (github.event_name == 'schedule' || inputs.recovery_only) && github.repository == 'danielsinewe/indiecrm-extension-rollout' && github.ref == 'refs/heads/main' && vars.CHROME_WEBSTORE_PUBLISH_ENABLED == 'true' && vars.CHROME_REVIEW_CLOCK_ID != '' && (github.event_name == 'schedule' || inputs.clock_id == vars.CHROME_REVIEW_CLOCK_ID)
    concurrency:
      group: indiecrm-chrome-review-watchdog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_ENABLED: ${{ vars.CHROME_WEBSTORE_PUBLISH_ENABLED }}
      REVIEW_CLOCK_ID: ${{ vars.CHROME_REVIEW_CLOCK_ID }}
      EXPECTED_CLOCK_ID: ${{ vars.CHROME_REVIEW_CLOCK_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Recover publication without starting another delayed chain
        run: >-
          node --input-type=module -e 'import { continueReviewClock } from "./src/review-clock.mjs"; console.log(JSON.stringify(continueReviewClock({ queueSuccessor: false })));'
