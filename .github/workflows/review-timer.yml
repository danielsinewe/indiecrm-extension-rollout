name: Automatic 15-minute IndieCRM 1.3.3 rollout
run-name: Chrome review timer · ${{ github.event_name }} · ${{ github.run_id }}
on:
  schedule:
    # Every 15 minutes at 11, 26, 41 and 56 UTC.
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: indiecrm-chrome-review-watch
  cancel-in-progress: false
jobs:
  check-review:
    if: github.repository == 'danielsinewe/indiecrm-extension-rollout' && github.ref == 'refs/heads/main' && vars.CHROME_WEBSTORE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Queue the isolated keyless publisher
        run: |
          gh workflow run store.yml --repo danielsinewe/indiecrm-extension-rollout --ref main \
            -f command=publish -f release_tag=chrome-extension-v1.3.3 \
            -f "request_id=review-timer-$GITHUB_RUN_ID"
          echo 'Queued the pinned 1.3.3 release; preserve pending reviews and stop only after the target is published at 100%.' >> "$GITHUB_STEP_SUMMARY"
